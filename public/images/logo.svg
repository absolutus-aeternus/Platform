<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="cartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9900"/>
      <stop offset="100%" style="stop-color:#e68a00"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF9900"/>
      <stop offset="100%" style="stop-color:#ffad33"/>
    </linearGradient>
  </defs>

  <!-- Shopping Cart Icon -->
  <g transform="translate(4, 12)">
    <!-- Cart body -->
    <path d="M8 8 L16 8 L28 48 L52 48 L60 20 L20 20" fill="none" stroke="url(#cartGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Cart handle -->
    <path d="M4 4 L8 8" fill="none" stroke="url(#cartGrad)" stroke-width="4" stroke-linecap="round"/>
    <!-- Wheels -->
    <circle cx="32" cy="56" r="4.5" fill="url(#cartGrad)"/>
    <circle cx="50" cy="56" r="4.5" fill="url(#cartGrad)"/>
    <!-- Package in cart -->
    <rect x="28" y="24" width="16" height="14" rx="2" fill="url(#cartGrad)" opacity="0.3"/>
    <line x1="36" y1="24" x2="36" y2="38" stroke="url(#cartGrad)" stroke-width="1.5" opacity="0.5"/>
    <line x1="28" y1="31" x2="44" y2="31" stroke="url(#cartGrad)" stroke-width="1.5" opacity="0.5"/>
    <!-- Speed lines -->
    <line x1="62" y1="28" x2="70" y2="28" stroke="#FF9900" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <line x1="64" y1="34" x2="74" y2="34" stroke="#FF9900" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
    <line x1="62" y1="40" x2="68" y2="40" stroke="#FF9900" stroke-width="2" stroke-linecap="round" opacity="0.2"/>
  </g>

  <!-- ALLIANCE -->
  <text x="82" y="52" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" fill="#131921" letter-spacing="-1">ALLIANCE</text>

  <!-- HUB with accent color -->
  <text x="244" y="52" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" fill="#FF9900" letter-spacing="-1">HUB</text>

  <!-- Underline accent -->
  <rect x="82" y="58" width="236" height="3" rx="1.5" fill="url(#accentGrad)" opacity="0.6"/>

  <!-- Tagline -->
  <text x="82" y="73" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#565959" letter-spacing="3" font-weight="500">PARTNER GLOBAL DROPSHIPPERS</text>
</svg>
